name: "Build kernels"

on:
  workflow_dispatch:
  push:
    branches:
      - chopin1
    paths:
      - '.github/workflows/build.yml'
      - 'repos/**'

env:
  OUT_DIR: "${{ github.workspace }}/out"

jobs:
  Set-repos:
    name: "Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
      builddate: ${{ steps.generate-builddate.outputs.builddate }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Generate Matrix"
        id: generate-matrix
        run: |
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          jq -s '[.[][]]' repos/repos*.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "Set builddate"
        id: generate-builddate
        run: echo "builddate=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "Build kernel"
    runs-on: ubuntu-latest
    needs:
      - Set-repos
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      WORKSPACE: ${{ github.workspace }}
      builddate: "${{ needs.Set-repos.outputs.builddate }}"
      KERNEL_NAME: ${{ matrix.repos.kernelSource.name }}
      KERNEL_REPO: ${{ matrix.repos.kernelSource.repo }}
      KERNEL_BRANCH: ${{ matrix.repos.kernelSource.branch }}
      KERNEL_DEVICE: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.defconfig }}
      withKernelSU: ${{ matrix.repos.withKernelSU }}
      ccache: ${{ matrix.repos.ccache }}
      useAnykernel: ${{ matrix.repos.AnyKernel3.use }}
      release: ${{ matrix.repos.AnyKernel3.release }}
    steps:
      - name: "Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libfl-dev curl git wget ccache python3 zip unzip patch kmod

      - name: "Setup Anykernel3"
        env:
          params: "${{ toJSON(matrix.repos.AnyKernel3) }}"
        run: |
          ANYKERNEL_REPO=$(echo $params | jq -r ".repo")
          ANYKERNEL_BRANCH=$(echo $params | jq -r ".branch")
          git clone --recursive --depth=1 -j $(nproc) --branch $ANYKERNEL_BRANCH $ANYKERNEL_REPO AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh

      - name: "Clone kernel source"
        run: |
          git clone --recursive --depth=1 -j $(nproc) --branch $KERNEL_BRANCH $KERNEL_REPO $KERNEL_NAME

      - name: "Get toolchains"
        env:
          toolchains: "${{ toJSON(matrix.repos.toolchains) }}"
        run: |
          toolchains_num="$(echo $toolchains | jq 'length')"
          for ((i=0;i<toolchains_num;i++)); do
            toolchain_name=$(echo $toolchains | jq -r ".[$i].name")
            toolchain_url=$(echo $toolchains | jq -r ".[$i].url")
            if [ -z "${toolchain_url:-}" ] || [ "$toolchain_url" = "null" ]; then
              toolchain_repo=$(echo $toolchains | jq -r ".[$i].repo")
              toolchain_branch=$(echo $toolchains | jq -r ".[$i].branch")
              git clone --recursive --depth=1 -j $(nproc) --branch $toolchain_branch $toolchain_repo $toolchain_name
            else
              wget "$toolchain_url"
              filename="${toolchain_url##*/}"
              mkdir -p $toolchain_name
              tar zxf "$filename" -C $toolchain_name 2>/dev/null || tar xf "$filename" -C $toolchain_name 2>/dev/null || unzip -d $toolchain_name "$filename"
            fi
            jq -r ".[$i].binPath[] | tostring" <<< "$toolchains" | while read -r bin_path; do
              echo "$WORKSPACE/$toolchain_name/$bin_path" >> $GITHUB_PATH
            done
          done

      - name: "Set args"
        id: generate-args
        env:
          params: "${{ toJSON(matrix.repos.params) }}"
          THREAD: $(nproc --all)
        run: |
          ARCH=$(echo $params | jq -r ".ARCH")
          CC=$(echo $params | jq -r ".CC")
          args="-j${{ env.THREAD }}"
          if [ -n "${{ env.OUT_DIR }}" ]; then
            mkdir -p ${{ env.OUT_DIR }} && args="$args O=${{ env.OUT_DIR }}"
          fi
          [ -n "$ARCH" ] && args="$args ARCH=$ARCH"
          if [ -n "$CC" ]; then
            [[ "$CC" == *"/"* ]] && CC=${{ env.WORKSPACE }}/$CC
            args="$args CC=$CC"
          fi
          while read -r externalCommand; do
            key=$(echo "$externalCommand" | cut -d= -f1)
            value=$(echo "$externalCommand" | cut -d= -f2-)
            [[ "$value" == *"/"* ]] && value="${{ env.WORKSPACE }}/$value"
            args="$args $key=$value"
          done < <(jq -r '.externalCommand | to_entries[] | "\(.key)=\(.value)"' <<< "$params")
          echo "ARCH=$ARCH" >> $GITHUB_OUTPUT
          echo "args=$args" >> $GITHUB_OUTPUT

      - name: "Update KernelSU"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        if: ${{ env.withKernelSU == 'true' }}
        run: |
          [ -d "./KernelSU" ] && rm -rf "./KernelSU"
          [ -d "./drivers/kernelsu" ] && rm -rf "./drivers/kernelsu"
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          echo "CONFIG_KPROBES=y" >> arch/${{ env.arch }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_HAVE_KPROBES=y" >> arch/${{ env.arch }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/${{ env.arch }}/configs/${{ env.DEFCONFIG_NAME }}

      - name: "Setup SuSFS"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        if: ${{ env.withKernelSU == 'true' }}
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu \
            || git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git ../susfs4ksu
          SUSFS_DIR="../susfs4ksu"
          echo "SuSFS structure:"
          find "$SUSFS_DIR" -maxdepth 3 -name "*.patch" | head -10
          # 找合适的补丁
          PATCH_FILE=$(find "$SUSFS_DIR" -name "*4.14*.patch" 2>/dev/null | head -1)
          [ -z "$PATCH_FILE" ] && PATCH_FILE=$(find "$SUSFS_DIR" -name "add_susfs_in_kernel*.patch" 2>/dev/null | head -1)
          if [ -n "$PATCH_FILE" ]; then
            patch -p1 --forward < "$PATCH_FILE" && echo "SuSFS patch OK" || echo "SuSFS patch already applied or failed"
          else
            echo "No patch found, trying direct file copy only"
          fi
          [ -d "$SUSFS_DIR/fs" ] && cp -r "$SUSFS_DIR/fs/"* fs/ 2>/dev/null || true
          [ -d "$SUSFS_DIR/include" ] && cp -r "$SUSFS_DIR/include/"* include/ 2>/dev/null || true
          # 添加 SuSFS configs
          {
            echo ""
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_SU=y"
          } >> arch/${{ env.arch }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "SuSFS configs added"

      - name: "Apply RE Patches"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        run: |
          # 逆向工程增强配置
          {
            echo ""
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_FTRACE=y"
            echo "CONFIG_FUNCTION_TRACER=y"
            echo "CONFIG_FUNCTION_GRAPH_TRACER=y"
            echo "CONFIG_DYNAMIC_FTRACE=y"
            echo "CONFIG_FTRACE_SYSCALLS=y"
            echo "CONFIG_PERF_EVENTS=y"
            echo "CONFIG_HW_PERF_EVENTS=y"
            echo "CONFIG_USERFAULTFD=y"
            echo "CONFIG_DEBUG_INFO=y"
            echo "CONFIG_FRAME_POINTER=y"
          } >> arch/${{ env.arch }}/configs/${{ env.DEFCONFIG_NAME }}

          # 修复 ptrace_scope 默认值（Frida 附加任意进程）
          YAMA="security/yama/yama_lsm.c"
          if [ -f "$YAMA" ]; then
            sed -i 's/static int ptrace_scope = 1;/static int ptrace_scope = 0;/' "$YAMA"
            sed -i 's/static int ptrace_scope = YAMA_SCOPE_RELATIONAL;/static int ptrace_scope = YAMA_SCOPE_DISABLED;/' "$YAMA"
            echo "ptrace_scope patched"
          fi
          echo "RE patches applied"

      - name: "Fix Clang 15 Prototype Warnings"
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          # 修复 hwconf_manager.c
          if grep -q "hw_item_dump()" arch/arm64/kernel/hwconf_manager.c 2>/dev/null; then
            sed -i 's/static char \*hw_item_dump()/static char *hw_item_dump(void)/g' arch/arm64/kernel/hwconf_manager.c
            echo "hwconf fixed"
          fi
          # 批量修复空参数列表
          python3 - << 'PYEOF'
import os, re
P = re.compile(
    r'^((?:static\s+)?(?:inline\s+)?(?:__init\s+)?'
    r'(?:int|void|char|long|bool|unsigned\s*\w*|struct\s+\w+\s*\*?|char\s*\*)'
    r'\s+\w+)\(\)(\s*(?:\{|;))',
    re.MULTILINE
)
n = 0
for d in ['arch/arm64/kernel', 'drivers', 'kernel', 'fs', 'mm']:
    if not os.path.exists(d):
        continue
    for root, dirs, files in os.walk(d):
        dirs[:] = [x for x in dirs if x not in ['scripts', '.git']]
        for f in files:
            if not (f.endswith('.c') or f.endswith('.h')):
                continue
            fp = os.path.join(root, f)
            try:
                c = open(fp, encoding='utf-8', errors='ignore').read()
                nc = P.sub(r'\1(void)\2', c)
                if nc != c:
                    open(fp, 'w', encoding='utf-8').write(nc)
                    n += 1
                    print(f'Fixed: {fp}')
            except Exception:
                pass
print(f'Total fixed: {n} files')
PYEOF

      - name: "Make defconfig"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
          arch: ${{ steps.generate-args.outputs.ARCH }}
        run: make ${{ env.args }} ${{ env.DEFCONFIG_NAME }}

      - name: "Build kernel"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: make ${{ env.args }}

      - name: "Upload Image"
        uses: actions/upload-artifact@v4
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: Image-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload Image.gz"
        uses: actions/upload-artifact@v4
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: Image.gz-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: "Pack AnyKernel3"
        if: ${{ env.useAnykernel == 'true' }}
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
          anykernel: "${{ env.WORKSPACE }}/${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}_${{ env.builddate }}"
        run: |
          [ -e "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image" ] && cp -f ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image ./AnyKernel3/
          [ -e "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz" ] && cp -f ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz ./AnyKernel3/
          cd AnyKernel3/ && zip -q -r "${{ env.anykernel }}.zip" *

      - name: "Upload AnyKernel3"
        uses: actions/upload-artifact@v4
        if: ${{ env.useAnykernel == 'true' }}
        with:
          name: "${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}_${{ env.builddate }}"
          path: AnyKernel3/*

      - name: "Create Release"
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        if: ${{ env.useAnykernel == 'true' && env.release == 'true' }}
        with:
          tag_name: v${{ env.builddate }}.${{ github.run_number }}
          files: "${{ env.WORKSPACE }}/${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}_${{ env.builddate }}.zip"
          generate_release_notes: true
